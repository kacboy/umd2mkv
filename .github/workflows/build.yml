name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - name: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - name: macos-intel
            os: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: ''
          - name: macos-apple-silicon
            os: macos-14
            goos: darwin
            goarch: arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build CLI
        shell: bash
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w" -o "dist/umd2mkv-${{ matrix.name }}${{ matrix.ext }}" ./cmd/umd2mkv
      - uses: actions/upload-artifact@v4
        with:
          name: umd2mkv-${{ matrix.name }}
          path: dist/*

  windows-gui:
    name: Windows GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build GUI
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/UMD2MKV.exe ./cmd/umd2mkv-gui
      - uses: actions/upload-artifact@v4
        with:
          name: umd2mkv-windows-gui
          path: dist/UMD2MKV.exe
